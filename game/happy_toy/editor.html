<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Happy Toy Map Editor</title>
    <link rel="stylesheet" href="./editor.css" />
  </head>
  <body>
    <div id="editor-app" class="editor-app">
      <header class="editor-header">
        <div>
          <p class="eyebrow">Happy Toy</p>
          <h1>Map Editor</h1>
        </div>
        <div class="header-actions">
          <a class="ghost-button" href="./">게임 열기</a>
          <button id="save-override-button" type="button">저장</button>
          <button id="clear-override-button" class="danger-button" type="button">저장 맵 해제</button>
        </div>
      </header>

      <main class="editor-shell">
        <aside class="editor-panel">
          <label>
            편집 레이어
            <select id="collection-select"></select>
          </label>
          <label>
            표시 층
            <select id="floor-filter">
              <option value="all">전체</option>
              <option value="1">1층</option>
              <option value="2">2층</option>
            </select>
          </label>

          <div class="button-grid">
            <button id="add-button" type="button">추가</button>
            <button id="duplicate-button" type="button">복제</button>
            <button id="delete-button" class="danger-button" type="button">삭제</button>
            <button id="reset-view-button" class="ghost-button" type="button">시야 초기화</button>
          </div>

          <div class="quick-help">
            <p>드래그: 선택/이동</p>
            <p>휠: 확대/축소</p>
            <p>우클릭 드래그: 화면 이동</p>
            <p>Delete: 선택 삭제</p>
          </div>

          <button id="validate-button" class="ghost-button full-button" type="button">맵 검증</button>
          <div id="validation-output" class="validation-output"></div>
        </aside>

        <section class="canvas-panel">
          <canvas id="map-canvas"></canvas>
          <div id="canvas-status" class="canvas-status"></div>
        </section>

        <aside class="editor-panel inspector-panel">
          <div class="panel-title">
            <h2>Inspector</h2>
            <span id="selection-label">선택 없음</span>
          </div>
          <div id="inspector-fields" class="inspector-fields"></div>
          <label class="raw-json-label">
            Raw JSON
            <textarea id="raw-json" spellcheck="false"></textarea>
          </label>
          <button id="apply-json-button" class="ghost-button full-button" type="button">Raw JSON 적용</button>
          <label class="raw-json-label export-block">
            Export
            <textarea id="export-json" spellcheck="false" readonly></textarea>
          </label>
        </aside>
      </main>
    </div>

    <script type="module" src="./src/editor/MapEditor.js"></script>
  </body>
</html>
