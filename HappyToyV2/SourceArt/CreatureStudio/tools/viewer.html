    }

  </section>
  <div id="badge">무음 미리보기</div>
  <div id="help">드래그 · 회전 &nbsp; / &nbsp; 휠 · 확대</div>
  <div id="overlay" role="status"><p id="message">완료된 모델을 확인합니다</p><span id="progress">잠시 기다려 주세요.</span></div>

      container.updateMatrixWorld(true);target.set(0,focusY,0).add(pan);
      camera.position.set(Math.sin(orbit.yaw)*Math.cos(orbit.pitch),Math.sin(orbit.pitch),Math.cos(orbit.yaw)*Math.cos(orbit.pitch)).multiplyScalar(orbit.distance).add(target);
      if(innerWidth>700){const right=new THREE.Vector3(Math.cos(orbit.yaw),0,-Math.sin(orbit.yaw)),shift=-(280/innerWidth)*orbit.distance*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*camera.aspect*.72;camera.position.addScaledVector(right,shift);target.addScaledVector(right,shift);}
      else{const up=new THREE.Vector3(-Math.sin(orbit.yaw)*Math.sin(orbit.pitch),Math.cos(orbit.pitch),-Math.cos(orbit.yaw)*Math.sin(orbit.pitch)),shift=-dockHeight/innerHeight*orbit.distance*Math.tan(THREE.MathUtils.degToRad(camera.fov/2));camera.position.addScaledVector(up,shift);target.addScaledVector(up,shift);}
      camera.lookAt(target);renderer.render(scene,camera);frames++;
      if(frames%30===0){debug.time=action?.time||0;debug.paused=paused;debug.speed=Number(ui.speed.value);debug.frames=frames;debug.renderCalls=renderer.info.render.calls;}
    });
    await refresh();
    setInterval(()=>{if(!loading&&catalog.some(entry=>!entry.ready))refresh();},15000);
  </script>
</body>
